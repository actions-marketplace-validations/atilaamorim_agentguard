name: AgentGuard
description: Audit AI-agent and MCP configuration for security and context risks
author: Atila Amorim

inputs:
  path:
    description: Directory or file to scan
    required: false
    default: "."
  fail-on-findings:
    description: Fail the workflow when AgentGuard reports findings
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install AgentGuard
      shell: bash
      run: python -m pip install -e "${{ github.action_path }}"
    - name: Run AgentGuard
      shell: bash
      run: |
        set +e
        agentguard scan "${{ inputs.path }}" --json --sarif agentguard-results.sarif > agentguard-report.json
        status=$?
        if [ "${{ inputs.fail-on-findings }}" = "true" ] && [ "$status" -ne 0 ]; then
          exit "$status"
        fi
        exit 0
    - name: Upload AgentGuard reports
      uses: actions/upload-artifact@v4
      with:
        name: agentguard-results
        path: |
          agentguard-report.json
          agentguard-results.sarif
