version: 1
fail_on_severity: high

ignore:
  # These paths contain intentional examples/fixtures used to test or explain
  # AgentGuard detections. Ignore only the specific rules they are demonstrating.
  - rule: AG-EXEC-001
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "docs/*"
      - "tests/*"
      - "examples/*"

  - rule: AG-MCP-001
    paths:
      - "tests/*"

  - rule: AG-MCP-002
    paths:
      - "tests/*"

  - rule: AG-MCP-003
    paths:
      - "tests/*"

  - rule: AG-POLICY-001
    paths:
      - "tests/*"

  - rule: AG-CODEX-001
    paths:
      - "tests/*"

  - rule: AG-GEMINI-001
    paths:
      - "tests/*"

  - rule: AG-OPENCODE-001
    paths:
      - "tests/*"

  - rule: AG-OPENCODE-002
    paths:
      - "tests/*"
