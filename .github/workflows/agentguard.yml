name: AgentGuard security audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Audit agent configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run AgentGuard
        run: agentguard scan . --json > agentguard-report.json || true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-report
          path: agentguard-report.json
