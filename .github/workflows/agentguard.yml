name: AgentGuard security audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    permissions:
      contents: read
      security-events: write
    name: Audit agent configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run AgentGuard
        shell: bash
        run: |
          set +e
          agentguard scan . --json --sarif agentguard-results.sarif > agentguard-report.json
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          exit 0
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: agentguard-report
          path: |
            agentguard-report.json
            agentguard-results.sarif
      - name: Upload SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: agentguard-results.sarif
