[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentconfigguard"
version = "0.3.1"
description = "Preflight security auditor for AI-agent and MCP configuration."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Atila Amorim"}]
keywords = [
    "ai-agents",
    "mcp",
    "security",
    "static-analysis",
    "prompt-injection",
    "github-actions",
    "ai-security",
    "agent-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/atilaamorim/agentguard"
Repository = "https://github.com/atilaamorim/agentguard"
Issues = "https://github.com/atilaamorim/agentguard/issues"

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
